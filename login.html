<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Join Soundwave</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page">
<header class="site-header"><nav class="navbar container" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark">◖</span> soundwave</a><div class="nav-links"><a href="index.html">Home</a><a href="browse.html">Browse</a><a href="playlist.html">Playlist</a></div><div class="nav-actions"><a href="login.html">Log in</a></div></nav></header>
<main class="login-main container"><section class="login-card"><a class="brand login-brand" href="index.html"><span class="brand-mark">◖</span> soundwave</a><p class="eyebrow green-text">YOUR SOUND STARTS HERE</p><h1>Join the <span>good side.</span></h1><p class="login-subtitle">Create a demo account layout and make your music corner feel like yours.</p>
<form action="#" method="get" class="signup-form">
<label for="full-name">Your name</label><input type="text" id="full-name" name="name" placeholder="Enter your name" required>
<label for="email">Email address</label><input type="email" id="email" name="email" placeholder="you@example.com" required>
<label for="password">Create a password</label><input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
<label class="check-label"><input type="checkbox" name="updates"> Send me music picks and updates.</label>
<button class="button button-green form-button" type="submit">Create account <span>→</span></button>
<p class="form-disclaimer">Demo form only. No information is sent or stored.</p>
</form><p class="back-home"><a href="index.html">← Back to home</a></p></section></main>
<footer class="site-footer"><div class="container footer-bottom"><span>© 2026 Soundwave. Student project.</span><span>HTML + CSS only</span></div></footer>
</body></html>
